x-app-env: &app-env
  POSTGRES_DB: article_rating
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: db
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A article_rating worker --loglevel=info
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: article_rating
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d article_rating"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
